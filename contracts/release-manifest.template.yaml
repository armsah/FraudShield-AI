# Replace all REPLACE_* placeholders before release.

# Do not store passwords, access tokens, private keys, or customer PII here.

# References to evidence must point to controlled, access-restricted storage.

#

# Release approval requires successful evaluation and security gates.

schema_version: "1.0.0"

